
name: Deploy BarrioSistema to Raspberry Pi

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-pi.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-barrio-pi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend for ARM64
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/federicobiaus/barriosistema-backend:latest
            ghcr.io/federicobiaus/barriosistema-backend:${{ github.sha }}

      - name: Build frontend for ARM64
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/federicobiaus/barriosistema-frontend:latest
            ghcr.io/federicobiaus/barriosistema-frontend:${{ github.sha }}


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check Raspberry Pi connectivity
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_SSH_PORT: ${{ secrets.PI_SSH_PORT }}
        run: |
          echo "Checking SSH connectivity to Raspberry Pi..."
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/${PI_HOST}/${PI_SSH_PORT}'
          echo "SSH port is reachable."

      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_SSH_PORT }}
          timeout: 30s
          command_timeout: 10m
          script: |
            cd ~/apps/BarrioSistema
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

